<div class="container-fluid mt-4">
  <h2>Employés</h2>

  <!-- Formulaire Ajout -->
  <div class="card mb-4" *ngIf="!editingEmploye">
    <div class="card-header">Nouvel Employé</div>
    <div class="card-body">
      <form (ngSubmit)="createEmploye()" class="row g-3">
        <div class="col-md-3">
          <input type="text" class="form-control" placeholder="Nom" [(ngModel)]="newEmploye.nom" name="nom" required>
        </div>
        <div class="col-md-3">
          <input type="email" class="form-control" placeholder="Email" [(ngModel)]="newEmploye.email" name="email" required>
        </div>
        <div class="col-md-2">
          <select class="form-select" [(ngModel)]="newEmploye.role" name="role" required>
            <option value="" disabled selected>Rôle</option>
            <option value="DEVELOPPEUR">Développeur</option>
            <option value="CHEF_PROJET">Chef Projet</option>
            <option value="DESIGNER">Designer</option>
            <option value="TESTEUR">Testeur</option>
            <option value="ANALYSTE">Analyste</option>
          </select>
        </div>
        <div class="col-md-2">
          <input type="text" class="form-control" placeholder="Équipe" [(ngModel)]="newEmploye.equipe" name="equipe">
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100">Ajouter</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Formulaire Modification -->
  <div class="card mb-4" *ngIf="editingEmploye">
    <div class="card-header">Modifier Employé</div>
    <div class="card-body">
      <form (ngSubmit)="updateEmploye()" class="row g-3">
        <div class="col-md-3">
          <input type="text" class="form-control" placeholder="Nom" [(ngModel)]="editingEmploye.nom" name="editNom" required>
        </div>
        <div class="col-md-3">
          <input type="email" class="form-control" placeholder="Email" [(ngModel)]="editingEmploye.email" name="editEmail" required>
        </div>
        <div class="col-md-2">
          <select class="form-select" [(ngModel)]="editingEmploye.role" name="editRole" required>
            <option value="DEVELOPPEUR">Développeur</option>
            <option value="CHEF_PROJET">Chef Projet</option>
            <option value="DESIGNER">Designer</option>
            <option value="TESTEUR">Testeur</option>
            <option value="ANALYSTE">Analyste</option>
          </select>
        </div>
        <div class="col-md-2">
          <input type="text" class="form-control" placeholder="Équipe" [(ngModel)]="editingEmploye.equipe" name="editEquipe">
        </div>
        <div class="col-md-1">
          <button type="submit" class="btn btn-success w-100">OK</button>
        </div>
        <div class="col-md-1">
          <button type="button" class="btn btn-secondary w-100" (click)="cancelEdit()">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <div class="card-header">Liste des Employés</div>
    <div class="card-body p-0">
      <table class="table mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Email</th>
            <th>Rôle</th>
            <th>Équipe</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let employe of employes">
            <td>{{employe.id}}</td>
            <td>{{employe.nom}}</td>
            <td>{{employe.email}}</td>
            <td><span class="badge bg-primary">{{employe.role}}</span></td>
            <td>{{employe.equipe}}</td>
            <td>
              <button class="btn btn-sm btn-primary me-2" (click)="editEmploye(employe)">Modifier</button>
              <button class="btn btn-sm btn-danger" (click)="deleteEmploye(employe.id!)">Supprimer</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
